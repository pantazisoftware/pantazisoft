<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PantaziSoft">
  <!--
    PantaziSoft logomark on brand lime, sized for icon use.

    Same construction as logo-transparent.svg: the cells that touch are merged
    into one outline so no interior edge is left to antialias into a visible
    seam. Canvas is 512 square on a 96-unit cell, with the 3×4 mark centred, so
    it drops straight into any square icon slot without needing a crop.
  -->
  <path fill="#7ccf00" d="M0 0h512v512H0z" />

  <!-- Stem (col 0, rows 1–3) plus the bowl's lower arm (col 1, row 2). -->
  <path fill="#0b0b0c" d="M112 160h96v96h96v96h-96v96h-96z" />

  <!-- The bowl's two free cells; they meet the stem only at corners. -->
  <path fill="#0b0b0c" d="M208 64h96v96h-96zM304 160h96v96h-96z" />

  <!-- The opening square, set into the top-left of its cell. -->
  <path fill="#ffffff" d="M112 64h60v60h-60z" />
</svg>
